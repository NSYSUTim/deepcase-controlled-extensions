[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcase-controlled-extensions"
version = "0.1.0"
description = "Controlled DeepCASE extensions for cross-host context, long-horizon context, and imbalanced security events."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
