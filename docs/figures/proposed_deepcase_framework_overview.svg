<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="920" viewBox="0 0 1700 920">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #111; }
      .panel-title { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #222; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #333; }
      .caption { font-family: "Times New Roman", Times, serif; font-size: 18px; fill: #111; }
      .caption-bold { font-family: "Times New Roman", Times, serif; font-size: 18px; font-weight: 700; fill: #111; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #111; }
      .box { fill: #fff; stroke: #111; stroke-width: 1.35; }
      .soft { fill: #f7f8f9; stroke: #111; stroke-width: 1.15; }
      .accent { fill: #eef5f6; stroke: #315f66; stroke-width: 1.25; }
      .shade { fill: #e9ecef; stroke: #111; stroke-width: 1.05; }
      .line { stroke: #111; stroke-width: 1.25; fill: none; }
      .thin { stroke: #111; stroke-width: 0.9; fill: none; }
      .dash { stroke: #111; stroke-width: 1.05; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8.5,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="920" fill="#fff"/>
  <text x="850" y="42" text-anchor="middle" class="title">Proposed DeepCASE-Based SOC Event Aggregation Framework</text>

  <!-- 1. Preprocessing -->
  <g id="preprocessing">
    <rect x="42" y="88" width="330" height="520" class="box"/>
    <circle cx="69" cy="115" r="13" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <text x="69" y="120" text-anchor="middle" class="panel-title">1</text>
    <text x="91" y="120" class="panel-title">Preprocessing</text>

    <rect x="92" y="154" width="230" height="54" class="soft"/>
    <text x="207" y="175" text-anchor="middle" class="label">Raw Wazuh alerts</text>
    <text x="207" y="194" text-anchor="middle" class="tiny">AIT-ADS JSONL records</text>

    <line x1="207" y1="208" x2="207" y2="246" class="line" marker-end="url(#arrow)"/>

    <rect x="92" y="246" width="230" height="76" class="accent"/>
    <text x="207" y="267" text-anchor="middle" class="label">DeepCASE-ready CSV</text>
    <text x="207" y="287" text-anchor="middle" class="tiny">sequence construction</text>
    <text x="207" y="306" text-anchor="middle" class="mono">timestamp,machine,event,label</text>

    <line x1="207" y1="322" x2="207" y2="358" class="line" marker-end="url(#arrow)"/>

    <rect x="92" y="358" width="230" height="54" class="soft"/>
    <text x="207" y="380" text-anchor="middle" class="label">Train / test split</text>
    <text x="207" y="399" text-anchor="middle" class="tiny">machine context preserved</text>

    <text x="207" y="454" text-anchor="middle" class="tiny">Ground-truth labels are</text>
    <text x="207" y="471" text-anchor="middle" class="tiny">reserved for evaluation.</text>

    <path d="M322,284 C358,284 356,502 392,502" class="dash" marker-end="url(#arrow)"/>
  </g>

  <!-- CSV sequence callout -->
  <g id="sequence-callout">
    <rect x="392" y="392" width="250" height="216" class="soft"/>
    <text x="517" y="420" text-anchor="middle" class="label">Constructed event sequences</text>
    <text x="517" y="442" text-anchor="middle" class="tiny">after CSV conversion</text>

    <g transform="translate(420,466)">
      <rect x="0" y="0" width="28" height="20" class="shade"/>
      <rect x="7" y="20" width="14" height="5" class="shade"/>
      <line x1="39" y1="11" x2="67" y2="11" class="line" marker-end="url(#arrow)"/>
      <text x="82" y="16" class="mono">A B C A D</text>

      <rect x="3" y="48" width="22" height="32" class="shade"/>
      <line x1="39" y1="64" x2="67" y2="64" class="line" marker-end="url(#arrow)"/>
      <text x="82" y="69" class="mono">B C D</text>

      <circle cx="14" cy="121" r="12" class="shade"/>
      <line x1="39" y1="121" x2="67" y2="121" class="line" marker-end="url(#arrow)"/>
      <text x="82" y="126" class="mono">A E C D</text>
    </g>

    <rect x="420" y="566" width="194" height="28" class="accent"/>
    <text x="517" y="584" text-anchor="middle" class="tiny">A,B,C = event types, not row IDs</text>
  </g>

  <line x1="372" y1="273" x2="432" y2="273" class="line" marker-end="url(#arrow)"/>

  <!-- 2. DeepCASE backbone and variants -->
  <g id="modeling">
    <rect x="432" y="88" width="560" height="270" class="box"/>
    <circle cx="459" cy="115" r="13" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <text x="459" y="120" text-anchor="middle" class="panel-title">2</text>
    <text x="481" y="120" class="panel-title">DeepCASE-based context modeling</text>

    <rect x="474" y="150" width="476" height="56" class="soft"/>
    <text x="712" y="173" text-anchor="middle" class="label">Shared backbone</text>
    <text x="712" y="194" text-anchor="middle" class="small">ContextBuilder -> attention representation -> Interpreter input</text>

    <rect x="474" y="224" width="228" height="48" class="soft"/>
    <text x="492" y="245" class="label">Baseline DeepCASE</text>
    <text x="492" y="264" class="tiny">same-host context, k = 10</text>

    <rect x="722" y="224" width="228" height="48" class="accent"/>
    <text x="740" y="245" class="label">Cross-host context</text>
    <text x="740" y="264" class="tiny">local + previous companion events</text>

    <rect x="474" y="288" width="228" height="48" class="accent"/>
    <text x="492" y="309" class="label">Hierarchical temporal context</text>
    <text x="492" y="328" class="tiny">short context + compact memory</text>

    <rect x="722" y="288" width="228" height="48" class="accent"/>
    <text x="740" y="309" class="label">Class-rebalanced triage</text>
    <text x="740" y="328" class="tiny">Focal Loss + binary incident head</text>
  </g>

  <line x1="992" y1="273" x2="1050" y2="273" class="line" marker-end="url(#arrow)"/>

  <!-- 3. Interpreter -->
  <g id="interpreter">
    <rect x="1050" y="88" width="260" height="520" class="box"/>
    <circle cx="1077" cy="115" r="13" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <text x="1077" y="120" text-anchor="middle" class="panel-title">3</text>
    <text x="1099" y="120" class="panel-title">Interpreter</text>

    <text x="1180" y="158" text-anchor="middle" class="label">Cluster scoring</text>
    <text x="1180" y="179" text-anchor="middle" class="tiny">attention representation</text>
    <text x="1180" y="195" text-anchor="middle" class="tiny">L1 distance</text>
    <text x="1180" y="211" text-anchor="middle" class="tiny">DBSCAN clustering</text>

    <g transform="translate(1104,245)">
      <circle cx="32" cy="33" r="25" class="dash"/>
      <circle cx="100" cy="33" r="25" class="dash"/>
      <circle cx="66" cy="92" r="25" class="dash"/>
      <circle cx="28" cy="30" r="4" fill="#111"/>
      <circle cx="39" cy="38" r="4" fill="#111"/>
      <circle cx="102" cy="28" r="4" fill="#111"/>
      <circle cx="94" cy="43" r="4" fill="#111"/>
      <circle cx="61" cy="89" r="4" fill="#111"/>
      <circle cx="72" cy="100" r="4" fill="#111"/>
    </g>

    <rect x="1092" y="392" width="176" height="148" class="soft"/>
    <text x="1180" y="413" text-anchor="middle" class="small">Prediction codes</text>
    <text x="1108" y="438" class="tiny">-4 benign/default</text>
    <text x="1108" y="458" class="tiny">-1 low confidence</text>
    <text x="1108" y="478" class="tiny">-2 unseen event type</text>
    <text x="1108" y="498" class="tiny">-3 distance reject</text>
    <text x="1108" y="518" class="tiny">&gt;=0 cluster score</text>
  </g>

  <line x1="1310" y1="273" x2="1372" y2="273" class="line" marker-end="url(#arrow)"/>

  <!-- 4. Evaluation -->
  <g id="evaluation">
    <rect x="1372" y="88" width="286" height="520" class="box"/>
    <circle cx="1399" cy="115" r="13" fill="#fff" stroke="#111" stroke-width="1.3"/>
    <text x="1399" y="120" text-anchor="middle" class="panel-title">4</text>
    <text x="1421" y="120" class="panel-title">Evaluation</text>

    <text x="1515" y="162" text-anchor="middle" class="label">Unified metrics</text>
    <line x1="1436" y1="181" x2="1594" y2="181" class="thin"/>
    <text x="1438" y="214" class="small">workload reduction</text>
    <text x="1438" y="244" class="small">cluster purity</text>
    <text x="1438" y="274" class="small">auto-decided rate</text>
    <text x="1438" y="304" class="small">reject rate</text>
    <text x="1438" y="334" class="small">binary F1</text>
    <text x="1438" y="364" class="small">weighted F1</text>

    <rect x="1438" y="425" width="154" height="116" class="soft"/>
    <text x="1515" y="445" text-anchor="middle" class="tiny">controlled setup</text>
    <text x="1515" y="466" text-anchor="middle" class="tiny">same AIT-ADS data</text>
    <text x="1515" y="486" text-anchor="middle" class="tiny">fixed CPU settings</text>
    <text x="1515" y="506" text-anchor="middle" class="tiny">hidden size 128</text>
    <text x="1515" y="526" text-anchor="middle" class="tiny">10 epochs, 100 queries</text>
  </g>

  <!-- Caption area -->
  <line x1="42" y1="685" x2="1658" y2="685" class="thin"/>
  <text x="42" y="726" class="caption-bold">Fig. 1.</text>
  <text x="100" y="726" class="caption">
    Overview of the proposed DeepCASE-based SOC event aggregation framework.
  </text>
  <text x="42" y="755" class="caption">
    Raw Wazuh alerts are first converted into DeepCASE-ready CSV records, and per-machine event sequences are constructed
  </text>
  <text x="42" y="784" class="caption">
    from these processed fields. The framework then compares the baseline with three controlled extensions: cross-host
  </text>
  <text x="42" y="813" class="caption">
    context, hierarchical temporal context, and class-rebalanced triage. All variants are evaluated under the same
  </text>
  <text x="42" y="842" class="caption">
    AIT-ADS data and fixed CPU settings to compare aggregation quality, rejection behavior, and detection performance.
  </text>
</svg>
